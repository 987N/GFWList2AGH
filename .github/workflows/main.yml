name: Build SmartDNS domain sets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartdns-domain-set-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: source
          path: source
          persist-credentials: false

      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: publish

      - name: Run unit tests
        working-directory: source
        run: python3 -m unittest discover -s tests -v

      - name: Build domain sets
        run: |
          ./source/release.sh \
            --output-dir "${GITHUB_WORKSPACE}/publish/gfwlist2smartdns"

      - name: Publish changed artifacts
        working-directory: publish
        run: |
          if git diff --quiet -- gfwlist2smartdns; then
            echo "Generated domain sets are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfwlist2smartdns
          git commit -m "Generated by GitHub Actions"
          git push origin HEAD:main
